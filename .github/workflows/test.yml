name: Test Suite

on:
  push:
    branches: [main, hardening]
  pull_request:
    branches: [main, hardening]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install unit test dependencies
        run: |
          pip install pytest pytest-html

      - name: Run unit tests
        run: |
          mkdir -p artifacts
          cd tests/unit
          python -m pytest . -v --html=../../artifacts/unit-report.html --self-contained-html || true

      - name: Upload unit test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: artifacts/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install integration test dependencies
        run: |
          pip install pytest pytest-html requests

      - name: Create .env files for services
        run: |
          echo "DB_URL=mongodb://root:example@localhost:27017/?authSource=admin" > dashboard/.env
          echo "DB_URL=mongodb://root:example@localhost:27017/?authSource=admin" > accounts/.env
          echo "DB_URL=mongodb://root:example@localhost:27017/?authSource=admin" > transactions/.env
          echo "DB_URL=mongodb://root:example@localhost:27017/?authSource=admin" > loan/.env
          echo "DATABASE_HOST=root:example@localhost" > customer-auth/.env
          echo "JWT_SECRET=test-jwt-secret" >> customer-auth/.env
          echo "DATABASE_HOST=root:example@localhost" > atm-locator/.env

      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=root \
            -e MONGO_INITDB_ROOT_PASSWORD=example \
            mongo:latest --replSet rs0 --bind_ip_all
          sleep 10
          docker exec mongo mongosh --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})" || true
          sleep 5

      - name: Run integration tests
        run: |
          mkdir -p artifacts
          cd tests/integration
          python -m pytest . -v --html=../../artifacts/integration-report.html --self-contained-html || true

      - name: Upload integration test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-report
          path: artifacts/

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Create artifacts directories
        run: mkdir -p artifacts/screenshots artifacts/videos

      - name: Run Playwright E2E tests
        working-directory: tests/e2e
        run: |
          npx playwright test --reporter=html || true
        env:
          BASE_URL: http://localhost:3000

      - name: Upload E2E test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-artifacts
          path: |
            artifacts/
            tests/e2e/playwright-report/
            tests/e2e/test-results/
